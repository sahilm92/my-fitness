<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122820"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>My Fitness</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#163528;background:#f4f5ef}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 20px calc(95px + env(safe-area-inset-bottom));max-width:650px;margin:auto}header{padding:30px 0 18px}header small{letter-spacing:3px;font-size:11px;font-weight:700}h1{font-size:34px;margin:8px 0}h2{font-size:20px;margin:0 0 18px}p{color:#607369;line-height:1.5}.card{background:white;border-radius:22px;padding:22px;margin:16px 0;border:1px solid #e3e8de}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#163528;color:white;padding:20px;border-radius:20px}.stat small{color:#c0cec1}.stat strong{display:block;font-size:30px;margin-top:8px}label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}input,select,textarea{font:inherit;width:100%;padding:13px;border:1px solid #ccd8cc;border-radius:12px;background:#fafbf7;min-width:0}textarea{resize:vertical}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 17px;background:#163528;color:white;font-weight:650}.primary{width:100%;margin-top:20px}.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}.muted{background:#edf1e7;color:#163528}.danger{background:#faebe6;color:#953c25}.entry{border-bottom:1px solid #e5eadd;padding:16px 0}.entry:last-child{border:0}.entry strong{display:block}.entry small{display:block;color:#64756b;margin:6px 0}.actions{display:flex;gap:8px;margin-top:12px}.actions button{padding:8px 12px;font-size:13px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:#f4f5eff5;border-top:1px solid #dfe6d9;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}nav button{background:transparent;color:#607369}nav button[aria-selected=true]{background:#163528;color:white}section[hidden]{display:none}svg{width:100%;height:160px}#status{font-size:14px;min-height:22px;color:#315e36}#history-filter{margin-bottom:8px}.empty{text-align:center;padding:20px 0;color:#64756b}button:focus-visible{outline:3px solid #a7c349;outline-offset:3px}
</style></head><body><header><small>YOUR DAILY PROGRESS</small><h1>My Fitness<span style="color:#88a647">.</span></h1><p>Keep it simple. Keep showing up.</p></header><div id="status" role="status" aria-live="polite"></div>
<section id="weight"><div class="stats"><div class="stat"><small>Latest weight</small><strong id="latest">—</strong></div><div class="stat"><small>Change since first</small><strong id="change">—</strong></div></div><div class="card"><h2>Weight trend</h2><div id="chart"></div></div><form id="weight-form" class="card"><h2 id="weight-title">Log your weight</h2><label for="weight-date">Date</label><input id="weight-date" type="date" required><label for="weight-value">Weight · kg</label><input id="weight-value" type="number" inputmode="decimal" step="0.1" min="1" max="500" placeholder="70.0" required><label for="weight-note">Note · optional</label><input id="weight-note" maxlength="500" placeholder="How are you feeling?"><button class="primary">Save weight</button><button type="button" class="muted primary cancel" hidden>Cancel edit</button></form></section>
<section id="workout" hidden><form id="workout-form" class="card"><h2 id="workout-title">Log an exercise</h2><label for="workout-date">Date</label><input id="workout-date" type="date" required><label for="exercise">Exercise</label><input id="exercise" list="exercises" maxlength="100" placeholder="e.g. Bench press" required><datalist id="exercises"><option value="Bench press"><option value="Squat"><option value="Deadlift"><option value="Lat pulldown"><option value="Shoulder press"><option value="Leg press"><option value="Push-ups"><option value="Biceps curl"></datalist><div class="row"><div><label for="sets">Sets</label><input id="sets" type="number" inputmode="numeric" min="1" max="100" value="3" required></div><div><label for="reps">Reps per set</label><input id="reps" type="number" inputmode="numeric" min="1" max="1000" value="10" required></div><div><label for="load">Load · kg</label><input id="load" type="number" inputmode="decimal" step="0.1" min="0" max="1000" value="0" required></div></div><p style="font-size:12px">Use 0 kg for bodyweight. Log separate entries if sets use different reps or loads.</p><label for="workout-note">Note · optional</label><textarea id="workout-note" rows="2" maxlength="500" placeholder="Technique, energy, or anything to remember"></textarea><button class="primary">Save exercise</button><button type="button" class="muted primary cancel" hidden>Cancel edit</button></form><div class="card"><h2>Today’s exercises</h2><div id="today"></div></div></section>
<section id="history" hidden><div class="card"><h2>Your history</h2><label for="history-filter">Show</label><select id="history-filter"><option value="all">Everything</option><option value="weight">Weight</option><option value="workout">Exercises</option></select><div id="entries"></div></div></section><nav aria-label="Main navigation"><button data-tab="weight" aria-selected="true">Weight</button><button data-tab="workout" aria-selected="false">Workout</button><button data-tab="history" aria-selected="false">History</button></nav><script src="app.js"></script></body></html>
